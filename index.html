<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自我介紹</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fa;
      color: #333;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    section {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      margin: 0 0 10px;
    }
    .info {
      margin-bottom: 10px;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>
<body>

<header>
  <h1>你的名字</h1>
  <p>簡短標語 / 職涯目標</p>
</header>

<section>
  <h2>關於我</h2>
  <p>這裡寫你的自我介紹，例如背景、個性、專長等。</p>
</section>

<section>
  <h2>技能</h2>
  <ul>
    <li>技能一</li>
    <li>技能二</li>
    <li>技能三</li>
  </ul>
</section>

<section>
  <h2>經歷</h2>
  <div class="info">
    <strong>公司 / 學校名稱</strong><br>
    職稱 / 科系<br>
    時間
  </div>
</section>

<section>
  <h2>聯絡我</h2>
  <p>Email: your@email.com</p>
  <p>LinkedIn: your-link</p>
</section>

<footer>
  <p>© 2026 你的名字</p>
</footer>

</body>
</html>
